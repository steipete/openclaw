name: Clawtributor focused proof
on:
  push:
    branches: [codex/clawtributor-proof-20260905]
permissions:
  contents: read
concurrency:
  group: clawtributor-focused-proof-${{ github.ref }}
  cancel-in-progress: false
jobs:
  proof:
    if: github.repository == 'steipete/openclaw'
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - lane: buzz
            source: 8637d26b73b3a8af65ecebd309d401c979a16813
            node: "24"
            pnpm: "12.3.4"
          - lane: feishu
            source: 8637d26b73b3a8af65ecebd309d401c979a16813
            node: "24"
            pnpm: "12.3.4"
          - lane: broker-diagnostic
            source: e71a547002e1a8dfb604857a81fa2c08390efb66
            node: "24.19.0"
            pnpm: "12.1.0"
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CI: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: proof
          persist-credentials: false
          sparse-checkout: scripts/clawtributor-proof
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: openclaw/openclaw
          ref: ${{ matrix.source }}
          path: target
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ matrix.node }}
      - name: Install pinned dependencies
        working-directory: target
        env:
          PNPM_VERSION: ${{ matrix.pnpm }}
        run: |
          npm install --global "pnpm@$PNPM_VERSION"
          pnpm install --frozen-lockfile
      - name: Compare baseline and repaired owner
        working-directory: target
        env:
          LANE: ${{ matrix.lane }}
          SOURCE_SHA: ${{ matrix.source }}
        run: |
          evidence="$GITHUB_WORKSPACE/evidence/$LANE"
          proof_dir="$GITHUB_WORKSPACE/proof/scripts/clawtributor-proof"
          case "$LANE" in
            buzz|feishu) bash "$proof_dir/run-channels.sh" "$LANE" "$proof_dir" "$evidence" ;;
            broker-diagnostic) bash "$proof_dir/diagnostic/run-broker-timer-diagnostic.sh" "$PWD" "$SOURCE_SHA" "$evidence" ;;
          esac
      - name: Retain proof
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: clawtributor-${{ matrix.lane }}
          path: evidence/
          if-no-files-found: warn
          retention-days: 7
