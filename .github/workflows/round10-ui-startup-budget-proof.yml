name: Round 10 secretless UI startup baseline proof

on:
  push:
    branches: [codex/round10-ui-startup-budget-proof]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fixed-baseline:
    if: github.repository == 'steipete/openclaw' && github.ref == 'refs/heads/codex/round10-ui-startup-budget-proof'
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Checkout reviewed proof assets
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: proof-assets
          persist-credentials: false
          fetch-depth: 1
      - name: Checkout immutable upstream baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: openclaw/openclaw
          ref: ddb4207d9211166eaae858a6f124481856808c26
          path: baseline
          persist-credentials: false
          fetch-depth: 1
      - name: Set up pinned Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          package-manager-cache: false
      - name: Measure the unchanged canonical build and retain its guard result
        shell: bash
        run: |
          env -i \
            PATH="$PATH" \
            GITHUB_REPOSITORY="$GITHUB_REPOSITORY" \
            GITHUB_SHA="$GITHUB_SHA" \
            GITHUB_REF="$GITHUB_REF" \
            GITHUB_EVENT_NAME="$GITHUB_EVENT_NAME" \
            GITHUB_RUN_ID="$GITHUB_RUN_ID" \
            GITHUB_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" \
            GITHUB_JOB="$GITHUB_JOB" \
            RUNNER_ENVIRONMENT="$RUNNER_ENVIRONMENT" \
            RUNNER_OS="$RUNNER_OS" \
            RUNNER_ARCH="$RUNNER_ARCH" \
            /usr/bin/python3 proof-assets/.github/proofs/round10/ui-budget/run-baseline.py \
            "$GITHUB_WORKSPACE/baseline" "$GITHUB_WORKSPACE/evidence-ui-budget"
      - name: Retain source bindings and actual production assets
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: ui-budget-baseline-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence-ui-budget
          retention-days: 14
          if-no-files-found: error
