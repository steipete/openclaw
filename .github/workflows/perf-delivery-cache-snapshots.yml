name: Delivery cache snapshot proof
on:
  push:
    branches: [codex/proof-delivery-cache-123624]
permissions:
  contents: read
jobs:
  snapshots:
    if: github.repository == 'steipete/openclaw'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: yu-xin-c/openclaw
          ref: f74ea1aff7129a377fab8d9bbba3a86a626dca56
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.20.0
      - name: Install pinned package manager and dependencies
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = f74ea1aff7129a377fab8d9bbba3a86a626dca56
          npm install --global pnpm@12.3.4
          pnpm install --frozen-lockfile
      - name: Build and verify public harness SDK compatibility
        run: |
          set -euo pipefail
          proof_state=$(mktemp -d)
          HOME="$proof_state" XDG_CONFIG_HOME="$proof_state/config" XDG_CACHE_HOME="$proof_state/cache" OPENCLAW_STATE_DIR="$proof_state/state" pnpm build qaRuntime
          mkdir -p snapshot-proof
          HOME="$proof_state" XDG_CONFIG_HOME="$proof_state/config" XDG_CACHE_HOME="$proof_state/cache" OPENCLAW_STATE_DIR="$proof_state/state" pnpm plugin-sdk:surface:check > snapshot-proof/sdk-surface.txt
          cat snapshot-proof/sdk-surface.txt
          HOME="$proof_state" XDG_CONFIG_HOME="$proof_state/config" XDG_CACHE_HOME="$proof_state/cache" OPENCLAW_STATE_DIR="$proof_state/state" node --input-type=module <<'EOF'
          import assert from 'node:assert/strict';
          import { createHash } from 'node:crypto';
          import { readFileSync, writeFileSync } from 'node:fs';
          import path from 'node:path';
          import { fileURLToPath } from 'node:url';
          import { buildHarnessVisibleReplyGuidance, buildUiPresentationPrompt } from 'openclaw/plugin-sdk/agent-harness-runtime';
          const sourceHead = 'f74ea1aff7129a377fab8d9bbba3a86a626dca56';
          const entry = 'dist/plugin-sdk/agent-harness-runtime.js';
          assert.equal(fileURLToPath(import.meta.resolve('openclaw/plugin-sdk/agent-harness-runtime')), path.join(process.cwd(), entry));
          for (const stamp of ['.buildstamp', '.runtime-postbuildstamp']) {
            assert.equal(JSON.parse(readFileSync(path.join('dist', stamp), 'utf8')).head, sourceHead);
          }
          assert.equal(typeof buildHarnessVisibleReplyGuidance, 'function');
          assert.equal(typeof buildUiPresentationPrompt, 'function');
          const uiPresentation = { showWidgetToolName: 'show_widget', dashboardToolName: 'dashboard', portalToolName: 'portal' };
          const ui = buildUiPresentationPrompt(uiPresentation);
          assert.ok(ui.includes('## UI Presentation'));
          for (const tool of Object.values(uiPresentation)) {
            assert.ok(ui.includes('`' + tool + '`'));
          }
          const modes = ['automatic', 'message_tool_only'];
          for (const sourceReplyDeliveryMode of modes) {
            const legacyInput = { sourceReplyDeliveryMode, messageToolAvailable: true, uiPresentation };
            const guidance = buildHarnessVisibleReplyGuidance(legacyInput);
            assert.equal(guidance, buildHarnessVisibleReplyGuidance({ ...legacyInput, requireExplicitMessageTarget: undefined }));
            assert.ok(guidance.endsWith('\n\n' + ui));
            assert.ok(guidance.includes(sourceReplyDeliveryMode === 'automatic' ? 'delivers your final response automatically' : 'Visible source replies are not automatically delivered'));
            assert.doesNotMatch(guidance, /target required this turn|current source is default target/);
          }
          const proof = { sourceHead, entry, modes, optionalTargetOmitted: true, explicitUndefinedEquivalent: true, uiGuidanceSha256: createHash('sha256').update(ui).digest('hex') };
          writeFileSync('snapshot-proof/sdk-compatibility.json', JSON.stringify(proof, null, 2) + '\n');
          console.log('[sdk-compatibility-proof]', JSON.stringify(proof));
          EOF
      - name: Generate the required synthetic prompt snapshots
        run: |
          set -euo pipefail
          proof_state=$(mktemp -d)
          HOME="$proof_state" XDG_CONFIG_HOME="$proof_state/config" XDG_CACHE_HOME="$proof_state/cache" OPENCLAW_STATE_DIR="$proof_state/state" pnpm prompt:snapshots:gen
          git diff --name-only > "$RUNNER_TEMP/changed-snapshot-paths.txt"
          if grep -v '^test/fixtures/agents/prompt-snapshots/codex-runtime-happy-path/' "$RUNNER_TEMP/changed-snapshot-paths.txt"; then
            echo 'Generator changed a path outside its snapshot scope' >&2
            exit 1
          fi
          mkdir -p snapshot-proof
          git diff --binary -- test/fixtures/agents/prompt-snapshots/codex-runtime-happy-path > snapshot-proof/snapshots.patch
          git rev-parse HEAD > snapshot-proof/source-head.txt
          git rev-parse HEAD^{tree} > snapshot-proof/source-tree.txt
          sha256sum snapshot-proof/snapshots.patch > snapshot-proof/sha256.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: delivery-cache-snapshots
          path: snapshot-proof/
          if-no-files-found: error
          retention-days: 7
