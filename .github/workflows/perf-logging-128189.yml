name: Ordinary file logging paired proof
on:
  push:
    branches: [codex/proof-logging-128189]
permissions:
  contents: read
jobs:
  paired:
    if: github.repository == 'steipete/openclaw'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out exact reviewed tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: tooling
          persist-credentials: false
          sparse-checkout: |
            .github/proof/logging-128189
            .github/workflows/perf-logging-128189.yml
          sparse-checkout-cone-mode: false
      - name: Check out immutable trusted baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: openclaw/openclaw
          ref: 5f661669b2c2979f2a61e23d4addb3bdd4545469
          path: sources/baseline
          persist-credentials: false
      - name: Check out immutable candidate source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: steipete/openclaw
          ref: 978e9a4cdc8b668f9a5856cf254b9e97a15834c3
          path: sources/candidate
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.20.0
      - name: Build matched runtimes and compare ordinary file logging
        env:
          TOOLING_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/logging-bootstrap"
          env -i PATH="$PATH" HOME="$RUNNER_TEMP/logging-bootstrap" \
            bash "$GITHUB_WORKSPACE/tooling/.github/proof/logging-128189/run.sh" \
            "$GITHUB_WORKSPACE/sources" "$RUNNER_TEMP/logging-128189" "$TOOLING_HEAD"
      - name: Retain source-bound component observations
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: logging-128189-paired
          path: |
            ${{ runner.temp }}/logging-128189/artifacts/tooling-head.txt
            ${{ runner.temp }}/logging-128189/artifacts/tooling-files.sha256
            ${{ runner.temp }}/logging-128189/artifacts/observations.json
            ${{ runner.temp }}/logging-128189/artifacts/driver-exit.txt
            ${{ runner.temp }}/logging-128189/artifacts/validation-summary.json
            ${{ runner.temp }}/logging-128189/artifacts/tests-exit.txt
            ${{ runner.temp }}/logging-128189/artifacts/collection-exit.txt
            ${{ runner.temp }}/logging-128189/artifacts/changed-checks-exit.txt
            ${{ runner.temp }}/logging-128189/artifacts/baseline/source-head.txt
            ${{ runner.temp }}/logging-128189/artifacts/baseline/source-tree.txt
            ${{ runner.temp }}/logging-128189/artifacts/baseline/source-inputs.sha256
            ${{ runner.temp }}/logging-128189/artifacts/baseline/built-runtime.json
            ${{ runner.temp }}/logging-128189/artifacts/candidate/source-head.txt
            ${{ runner.temp }}/logging-128189/artifacts/candidate/source-tree.txt
            ${{ runner.temp }}/logging-128189/artifacts/candidate/source-inputs.sha256
            ${{ runner.temp }}/logging-128189/artifacts/candidate/built-runtime.json
          if-no-files-found: error
          retention-days: 7
