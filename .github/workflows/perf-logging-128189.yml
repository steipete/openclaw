name: Ordinary file logging baseline proof
on:
  push:
    branches: [codex/proof-logging-128189]
permissions:
  contents: read
jobs:
  baseline:
    if: github.repository == 'steipete/openclaw'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out exact reviewed tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: tooling
          persist-credentials: false
          sparse-checkout: |
            .github/proof/logging-128189
            .github/workflows/perf-logging-128189.yml
          sparse-checkout-cone-mode: false
      - name: Check out immutable trusted baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: openclaw/openclaw
          ref: 44dbc50d172e9e7ec407b8e21e26aefa430cc933
          path: source
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.20.0
      - name: Build runtime and observe ordinary file logging
        env:
          TOOLING_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/logging-bootstrap"
          env -i PATH="$PATH" HOME="$RUNNER_TEMP/logging-bootstrap" \
            bash "$GITHUB_WORKSPACE/tooling/.github/proof/logging-128189/run.sh" \
            "$GITHUB_WORKSPACE/source" "$RUNNER_TEMP/logging-128189" "$TOOLING_HEAD" baseline
      - name: Retain source-bound component observations
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: logging-128189-baseline
          path: |
            ${{ runner.temp }}/logging-128189/artifacts/source-head.txt
            ${{ runner.temp }}/logging-128189/artifacts/source-tree.txt
            ${{ runner.temp }}/logging-128189/artifacts/tooling-head.txt
            ${{ runner.temp }}/logging-128189/artifacts/source-inputs.sha256
            ${{ runner.temp }}/logging-128189/artifacts/tooling-files.sha256
            ${{ runner.temp }}/logging-128189/artifacts/built-runtime.json
            ${{ runner.temp }}/logging-128189/artifacts/observations.json
            ${{ runner.temp }}/logging-128189/artifacts/driver-exit.txt
          if-no-files-found: error
          retention-days: 7
