name: ClawSweeper current-main owner-strength verification
run-name: ClawSweeper owner-strength canonical check and28 observations

on:
  push:
    branches: [codex/clawsweeper-main03182-owner-strength-proof-v1]

permissions:
  contents: read

concurrency:
  group: clawsweeper-main03182-owner-strength-proof-v1
  cancel-in-progress: false

jobs:
  classifier-diagnostic:
    if: github.repository == 'steipete/openclaw'
    runs-on: ubuntu-24.04
    timeout-minutes: 32
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - name: Checkout this exact proof-control commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: controls
          persist-credentials: false
          fetch-depth: 1

      - name: Checkout exact public ClawSweeper main without a product overlay
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: openclaw/clawsweeper
          ref: 03182ae34303203557df136e147297ad5be25099
          path: source
          persist-credentials: false
          fetch-depth: 1

      - name: Verify public main and apply the exact five-path candidate
        timeout-minutes: 2
        shell: bash
        env:
          PROOF_CONTROL_SHA: ${{ github.sha }}
          PROOF_WORKFLOW_SHA: ${{ github.workflow_sha }}
          PROOF_RUN_ID: ${{ github.run_id }}
          PROOF_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          test "$(git -C controls rev-parse HEAD)" = "$PROOF_CONTROL_SHA"
          if git -C controls config --get-regexp '^http\..*\.extraheader$' >/dev/null; then
            echo 'Controls checkout retained an HTTP credential header.' >&2
            exit 1
          fi
          python3 -I controls/.github/proof/clawsweeper-main03182-owner-strength-v1/run.py \
            prepare "$GITHUB_WORKSPACE/source" "$RUNNER_TEMP/clawsweeper-main03182-owner-strength/results"

      - name: Install the exact Node runtime without dependency caching
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        timeout-minutes: 3
        with:
          node-version: "24.19.0"
          architecture: x64
          check-latest: false
          package-manager-cache: false

      - name: Frozen install, format approved files, canonical check, then candidate24 and original4
        timeout-minutes: 25
        shell: bash
        run: |
          set -euo pipefail
          python3 -I controls/.github/proof/clawsweeper-main03182-owner-strength-v1/run.py \
            execute "$GITHUB_WORKSPACE/source" "$RUNNER_TEMP/clawsweeper-main03182-owner-strength/results"

      - name: Retain only bounded diagnostic observations and provenance
        if: always()
        id: collect
        timeout-minutes: 1
        shell: bash
        run: |
          set -euo pipefail
          python3 -I controls/.github/proof/clawsweeper-main03182-owner-strength-v1/run.py \
            collect "$GITHUB_WORKSPACE/source" "$RUNNER_TEMP/clawsweeper-main03182-owner-strength/results"
          echo 'ready=true' >> "$GITHUB_OUTPUT"

      - name: Upload this diagnostic's explicit artifact directory
        if: always() && steps.collect.outputs.ready == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: clawsweeper-main03182-owner-strength-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/clawsweeper-main03182-owner-strength/publish
          if-no-files-found: error
          retention-days: 7
