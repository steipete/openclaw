name: Round 10 secretless behavior proof

on:
  push:
    branches: [codex/round10-secretless-proof]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  proof:
    if: github.repository == 'steipete/openclaw' && github.ref == 'refs/heads/codex/round10-secretless-proof'
    name: Proof PR ${{ matrix.pr }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - pr: '127959'
            head: 378bd531c142e380c5b08265b9d4a37f385f2b56
          - pr: '132266'
            head: d5fe57837181ce7faa322960504bcf359329fbb9
    steps:
      - name: Checkout reviewed proof assets
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: proof-assets
          persist-credentials: false
          fetch-depth: 1
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: openclaw/openclaw
          ref: ${{ matrix.head }}
          path: candidate
          persist-credentials: false
          fetch-depth: 1
      - name: Install canonical Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          package-manager-cache: false
      - name: Run exact source and behavior proof
        shell: bash
        env:
          PROOF_PR: ${{ matrix.pr }}
        run: |
          env -i \
            PATH="$PATH" \
            GITHUB_REPOSITORY="$GITHUB_REPOSITORY" GITHUB_SHA="$GITHUB_SHA" \
            GITHUB_REF="$GITHUB_REF" GITHUB_EVENT_NAME="$GITHUB_EVENT_NAME" \
            GITHUB_RUN_ID="$GITHUB_RUN_ID" GITHUB_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" \
            GITHUB_JOB="$GITHUB_JOB" RUNNER_ENVIRONMENT="$RUNNER_ENVIRONMENT" \
            RUNNER_OS="$RUNNER_OS" RUNNER_ARCH="$RUNNER_ARCH" \
            /usr/bin/python3 "$GITHUB_WORKSPACE/proof-assets/.github/proofs/round10/run-proof.py" \
            "$PROOF_PR" "$GITHUB_WORKSPACE/candidate" "$RUNNER_TEMP/round10-proof-$PROOF_PR"
      - name: Retain success or failure evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: round10-proof-${{ matrix.pr }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/round10-proof-${{ matrix.pr }}/
          if-no-files-found: warn
          retention-days: 14
