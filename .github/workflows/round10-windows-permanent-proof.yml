name: Windows permanent installer regression proof
on:
  push:
    branches:
      - codex/round10-windows-permanent-proof
permissions:
  contents: read
jobs:
  permanent-installer-test:
    runs-on: windows-2025
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout reviewed proof assets
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: proof-assets
          persist-credentials: false
      - name: Checkout frozen original source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: openclaw/openclaw
          ref: af531525c46444521986002d64b888ee5ed097cb
          path: before
          persist-credentials: false
      - name: Checkout published repaired source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: openclaw/openclaw
          ref: edb35c6c96346b573bb6389cba40dcdba273fe56
          path: after
          persist-credentials: false
      - name: Setup pinned Windows CI Node line
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.3
          package-manager-cache: false
      - name: Prove exact permanent test before and after
        run: |
          python proof-assets/.github/proofs/135410-permanent/run-proof.py \
            "$GITHUB_WORKSPACE/before" "$GITHUB_WORKSPACE/after" \
            "$RUNNER_TEMP/permanent-proof-work" "$RUNNER_TEMP/permanent-proof-output"
      - name: Retain success or failure evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: permanent-installer-proof-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/permanent-proof-output/
          retention-days: 14
          if-no-files-found: error
