name: Model auth RPC paired proof
on:
  push:
    branches: [codex/proof-model-auth-125900]
permissions:
  contents: read
jobs:
  paired:
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - phase: baseline
            repository: openclaw/openclaw
            source: b392c6080f7c12782a2c808c742eb93b25cd5979
          - phase: candidate
            repository: steipete/openclaw
            source: c9ac2e0b2431f8939a93c1e41cb1db24e9e5af19
    if: github.repository == 'steipete/openclaw'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact reviewed proof tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: tooling
          persist-credentials: false
          sparse-checkout: |
            .github/proof/model-auth-125900
            .github/workflows/perf-model-auth-rpc.yml
          sparse-checkout-cone-mode: false
      - name: Check out immutable reviewed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ matrix.repository }}
          ref: ${{ matrix.source }}
          path: source
          fetch-depth: 3
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.20.0
      - name: Build and passively observe the owned Gateway and Chromium
        env:
          TOOLING_HEAD: ${{ github.sha }}
          PROOF_PHASE: ${{ matrix.phase }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/model-auth-bootstrap"
          env -i PATH="$PATH" HOME="$RUNNER_TEMP/model-auth-bootstrap" \
            bash "$GITHUB_WORKSPACE/tooling/.github/proof/model-auth-125900/run.sh" \
            "$GITHUB_WORKSPACE/source" "$RUNNER_TEMP/model-auth-125900" "$TOOLING_HEAD" "$PROOF_PHASE"
      - name: Retain source-bound synthetic proof and failure diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: model-auth-rpc-${{ matrix.phase }}
          path: |
            ${{ runner.temp }}/model-auth-125900/artifacts/source-head.txt
            ${{ runner.temp }}/model-auth-125900/artifacts/source-tree.txt
            ${{ runner.temp }}/model-auth-125900/artifacts/tooling-head.txt
            ${{ runner.temp }}/model-auth-125900/artifacts/source-inputs.sha256
            ${{ runner.temp }}/model-auth-125900/artifacts/changed-paths.txt
            ${{ runner.temp }}/model-auth-125900/artifacts/registry.patch
            ${{ runner.temp }}/model-auth-125900/artifacts/driver.e2e.test.ts
            ${{ runner.temp }}/model-auth-125900/artifacts/observation-exit.txt
            ${{ runner.temp }}/model-auth-125900/artifacts/owner-tests.json
            ${{ runner.temp }}/model-auth-125900/artifacts/owner-tests-exit.txt
            ${{ runner.temp }}/model-auth-125900/artifacts/startup-normal.json
            ${{ runner.temp }}/model-auth-125900/artifacts/startup-comparison.json
            ${{ runner.temp }}/model-auth-125900/artifacts/startup-check-exit.txt
            ${{ runner.temp }}/model-auth-125900/artifacts/browser/**/auth-rpc-observation.json
            ${{ runner.temp }}/model-auth-125900/artifacts/browser/**/provider-http.json
            ${{ runner.temp }}/model-auth-125900/artifacts/browser/**/visible-status.json
            ${{ runner.temp }}/model-auth-125900/artifacts/browser/**/model-providers-synthetic.png
          if-no-files-found: error
          retention-days: 7
