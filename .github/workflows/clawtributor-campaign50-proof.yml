name: Clawtributor campaign proof
on:
  push:
    branches: [codex/clawtributor-campaign50-proof-20260905]
permissions:
  contents: read
concurrency:
  group: clawtributor-campaign50-proof
  cancel-in-progress: false
jobs:
  plan:
    if: github.repository == 'steipete/openclaw'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          sparse-checkout: scripts/clawtributor-campaign50
      - id: plan
        name: Resolve pinned proof lanes
        run: python3 scripts/clawtributor-campaign50/select-matrix.py
  telemetry-reuse:
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.matrix).include.*.id, 'telemetry-packaged-red-remaining')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          sparse-checkout: scripts/clawtributor-campaign50
      - name: Initialize isolated transport receipt
        run: |
          set -euo pipefail
          [[ "$RUNNER_ENVIRONMENT" == github-hosted ]]
          mkdir -p "$RUNNER_TEMP/telemetry-reuse/raw"
          printf '%s\n' '{"passed":false,"phase":"download-not-complete"}' > "$RUNNER_TEMP/telemetry-reuse/receipt.json"
      - name: Download the immutable prior package artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: '10003125023'
          repository: steipete/openclaw
          run-id: '34078660938'
          github-token: ${{ github.token }}
          skip-decompress: true
          digest-mismatch: error
          path: ${{ runner.temp }}/telemetry-reuse/raw
      - name: Verify and select retained package evidence
        run: |
          python3 scripts/clawtributor-campaign50/verify-telemetry-transfer.py \
            scripts/clawtributor-campaign50/lanes/telemetry-packaged-red-remaining/reuse-manifest.json \
            "$RUNNER_TEMP/telemetry-reuse/raw" "$RUNNER_TEMP/telemetry-reuse/verified" \
            "$RUNNER_TEMP/telemetry-reuse/receipt.json"
      - name: Transfer verified data to this run
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: campaign50-telemetry-reuse-input-${{ github.run_attempt }}
          path: ${{ runner.temp }}/telemetry-reuse/verified/
          if-no-files-found: error
          retention-days: 14
      - name: Retain transport receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: campaign50-telemetry-transport-receipt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/telemetry-reuse/receipt.json
          if-no-files-found: error
          retention-days: 14
  proof:
    needs: [plan, telemetry-reuse]
    if: always() && !cancelled() && needs.plan.result == 'success'
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: proof
          persist-credentials: false
          sparse-checkout: scripts/clawtributor-campaign50
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: openclaw/openclaw
          ref: ${{ matrix.source }}
          path: target
          persist-credentials: false
      - name: Receive verified package evidence from this run
        if: matrix.id == 'telemetry-packaged-red-remaining'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: campaign50-telemetry-reuse-input-${{ github.run_attempt }}
          digest-mismatch: error
          path: proof/scripts/clawtributor-campaign50/lanes/telemetry-packaged-red-remaining/reuse-input
      - name: Verify exact macOS proof host
        if: runner.os == 'macOS'
        id: mac-preflight
        env:
          PROOF_LANE: ${{ matrix.id }}
          SOURCE_SHA: ${{ matrix.source }}
        run: |
          set -euo pipefail
          evidence="$GITHUB_WORKSPACE/evidence/$PROOF_LANE"
          mkdir -p "$evidence"
          python3 "$GITHUB_WORKSPACE/proof/scripts/clawtributor-campaign50/preflight-macos.py" \
            "$GITHUB_WORKSPACE/target" "$evidence"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ matrix.node }}
      - name: Run isolated source-bound proof
        if: runner.os == 'Linux'
        env:
          PROOF_LANE: ${{ matrix.id }}
          PROOF_DIRECTORY: ${{ matrix.directory }}
          PROOF_MODE: ${{ matrix.mode }}
          PROOF_VARIANT: ${{ matrix.variant }}
          SOURCE_SHA: ${{ matrix.source }}
          NODE_VERSION: ${{ matrix.node }}
          PNPM_VERSION: ${{ matrix.pnpm }}
        run: |
          set -euo pipefail
          [[ "$RUNNER_ENVIRONMENT" == github-hosted ]]
          evidence="$GITHUB_WORKSPACE/evidence/$PROOF_LANE"
          mkdir -p "$evidence"
          bootstrap="$GITHUB_WORKSPACE/proof/scripts/clawtributor-campaign50/bootstrap.sh"
          if [[ "$PROOF_VARIANT" == installer-ownership ]]; then
            [[ "$PROOF_LANE" == uninstall-owner-posix && "$PROOF_DIRECTORY" == uninstall-owner-contract && "$PROOF_MODE" == baseline ]]
            [[ "$SOURCE_SHA" == f5a30f8484671abdb422a9ea8b39837a668ed019 && "$NODE_VERSION" == 24.20.0 && "$PNPM_VERSION" == 12.3.4 ]]
            bootstrap="$GITHUB_WORKSPACE/proof/scripts/clawtributor-campaign50/lanes/$PROOF_DIRECTORY/bootstrap-linux.sh"
          fi
          env -i PATH="$PATH" HOME="$RUNNER_TEMP/campaign50-$PROOF_LANE-home" \
            CI=1 LANG=C.UTF-8 TZ=UTC \
            PROOF_LANE="$PROOF_LANE" PROOF_MODE="$PROOF_MODE" PROOF_VARIANT="$PROOF_VARIANT" \
            SOURCE_SHA="$SOURCE_SHA" NODE_VERSION="$NODE_VERSION" PNPM_VERSION="$PNPM_VERSION" \
            OPENCLAW_VITEST_MAX_WORKERS=2 \
            bash "$bootstrap" \
            "$GITHUB_WORKSPACE/target" \
            "$GITHUB_WORKSPACE/proof/scripts/clawtributor-campaign50/lanes/$PROOF_DIRECTORY" \
            "$evidence"
      - name: Run isolated macOS source-bound proof
        if: runner.os == 'macOS'
        env:
          PROOF_LANE: ${{ matrix.id }}
          PROOF_DIRECTORY: ${{ matrix.directory }}
          PROOF_MODE: ${{ matrix.mode }}
          PROOF_VARIANT: ${{ matrix.variant }}
          SOURCE_SHA: ${{ matrix.source }}
          NODE_VERSION: ${{ matrix.node }}
          PNPM_VERSION: ${{ matrix.pnpm }}
          DEVELOPER_DIR: ${{ steps.mac-preflight.outputs.developer_dir }}
        run: |
          set -euo pipefail
          [[ "$RUNNER_ENVIRONMENT" == github-hosted && "$RUNNER_OS" == macOS ]]
          [[ "$CI" == true && "$GITHUB_ACTIONS" == true ]]
          macos_user="$(/usr/bin/id -un)"
          [[ -n "$macos_user" ]]
          evidence="$GITHUB_WORKSPACE/evidence/$PROOF_LANE"
          task_root="$(mktemp -d /tmp/oc-proof-XXXXXX)"
          mkdir -m 700 "$task_root/home" "$task_root/tmp"
          set +e
          env -i PATH="$DEVELOPER_DIR/Toolchains/XcodeDefault.xctoolchain/usr/bin:$PATH" \
            USER="$macos_user" \
            HOME="$task_root/home" CFFIXED_USER_HOME="$task_root/home" \
            TMPDIR="$task_root/tmp/" TMP="$task_root/tmp" TEMP="$task_root/tmp" \
            CI="$CI" GITHUB_ACTIONS="$GITHUB_ACTIONS" RUNNER_OS="$RUNNER_OS" \
            RUNNER_ENVIRONMENT="$RUNNER_ENVIRONMENT" RUNNER_TEMP="$RUNNER_TEMP" \
            RUNNER_TRACKING_ID="$RUNNER_TRACKING_ID" DEVELOPER_DIR="$DEVELOPER_DIR" \
            LANG=en_US.UTF-8 TZ=UTC \
            PROOF_LANE="$PROOF_LANE" PROOF_MODE="$PROOF_MODE" PROOF_VARIANT="$PROOF_VARIANT" \
            SOURCE_SHA="$SOURCE_SHA" NODE_VERSION="$NODE_VERSION" PNPM_VERSION="$PNPM_VERSION" \
            bash "$GITHUB_WORKSPACE/proof/scripts/clawtributor-campaign50/bootstrap-macos.sh" \
            "$GITHUB_WORKSPACE/target" \
            "$GITHUB_WORKSPACE/proof/scripts/clawtributor-campaign50/lanes/$PROOF_DIRECTORY" \
            "$evidence" "$task_root" > "$evidence/bootstrap.log" 2>&1
          proof_exit=$?
          set -e
          printf 'macOS proof exited %s; retained artifacts: %s\n' "$proof_exit" "$evidence"
          exit "$proof_exit"
      - name: Run isolated Windows source-bound proof
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          PROOF_LANE: ${{ matrix.id }}
          PROOF_DIRECTORY: ${{ matrix.directory }}
          PROOF_MODE: ${{ matrix.mode }}
          SOURCE_SHA: ${{ matrix.source }}
          NODE_VERSION: ${{ matrix.node }}
          PNPM_VERSION: ${{ matrix.pnpm }}
        run: |
          $ErrorActionPreference = "Stop"
          $proofRoot = Join-Path $env:GITHUB_WORKSPACE "proof/scripts/clawtributor-campaign50"
          $laneDir = Join-Path $proofRoot "lanes/$env:PROOF_DIRECTORY"
          $targetDir = Join-Path $env:GITHUB_WORKSPACE "target"
          $evidenceDir = Join-Path $env:GITHUB_WORKSPACE "evidence/$env:PROOF_LANE"
          & (Join-Path $laneDir "bootstrap-windows.ps1") $targetDir $laneDir $evidenceDir $env:PROOF_MODE
          exit $LASTEXITCODE
      - name: Retain proof artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: campaign50-${{ matrix.id }}-${{ github.run_attempt }}
          path: |
            evidence/${{ matrix.id }}/
            target/.artifacts/qa-e2e/campaign-memory-flush-*/
          if-no-files-found: error
          retention-days: 14
