name: Cron recipient UI before and after proof

on:
  push:
    branches: [codex/cron-recipient-ui-proof]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  proof:
    if: github.repository == 'steipete/openclaw' && github.ref == 'refs/heads/codex/cron-recipient-ui-proof'
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - name: Checkout reviewed proof assets
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: proof-assets
          persist-credentials: false
          fetch-depth: 1
      - name: Checkout exact published candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: openclaw/openclaw
          ref: 75ed93cf6a29f113e5c1556f896a711f13f22e2d
          path: source
          persist-credentials: false
          fetch-depth: 1
      - name: Install canonical Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          package-manager-cache: false
      - name: Require exact baseline RED then owner-only GREEN
        shell: bash
        run: |
          env -i \
            PATH="$PATH" \
            GITHUB_REPOSITORY="$GITHUB_REPOSITORY" GITHUB_SHA="$GITHUB_SHA" \
            GITHUB_REF="$GITHUB_REF" GITHUB_EVENT_NAME="$GITHUB_EVENT_NAME" \
            GITHUB_RUN_ID="$GITHUB_RUN_ID" GITHUB_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" \
            GITHUB_JOB="$GITHUB_JOB" RUNNER_ENVIRONMENT="$RUNNER_ENVIRONMENT" \
            RUNNER_OS="$RUNNER_OS" RUNNER_ARCH="$RUNNER_ARCH" \
            /usr/bin/python3 "$GITHUB_WORKSPACE/proof-assets/.github/proofs/cron-recipient/run-proof.py" \
            "$GITHUB_WORKSPACE/source" "$RUNNER_TEMP/cron-recipient-evidence"
      - name: Retain success or failure evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: cron-recipient-ui-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cron-recipient-evidence/
          if-no-files-found: warn
          retention-days: 14
